[project]
name = "datalife"
version = "0.1.0"
description = "DataLife"
requires-python = ">=3.13"
dependencies = [
	"PyMuPDF==1.27.1",
	"pymupdf4llm==0.3.4",
	"tiktoken==0.12.0",
	"pydantic==2.12.5",
	"pydantic-ai==1.63.0",
	"httpx==0.28.1",
	"SQLAlchemy==2.0.48",
	"aiosqlite==0.22.1",
	"notion-client==2.7.0",
	"python-dotenv==1.2.1"
]

[project.optional-dependencies]
dev = [
	"ruff==0.15.4",
	"basedpyright==1.38.0",
	"pytest==9.0.2",
	"pytest-asyncio==1.3.0",
	"pytest-cov==7.0.0"
]

[tool.basedpyright]
include = ["core"]
pythonVersion = "3.13"
venvPath = "."
venv = "venv"

[tool.ruff]
include = ["core/**/*.py"]

[tool.logfire]
ignore_no_config = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
	"ignore:The test .* is marked with '@pytest.mark.asyncio' but it is not an async function:pytest.PytestWarning",
]
testpaths = ["tests"]
markers = [
	"unit: 标记为单元测试",
	"integration: 标记为集成测试",
	"fast: 执行时间少于1秒的快速测试",
	"slow: 执行时间超过1秒的慢速测试",
	"real_network: 需要真实网络连接的测试",
]